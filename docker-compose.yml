services:
  web_app:
    container_name: web_app
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata backup_data.json &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    # restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
  db:
    container_name: pet_shelter_db
    image: postgres:15
    hostname: db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - .env
    # restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pet_shelter_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

# to create container use:
# docker-compose up -d
# python manage.py loaddata backup_data.json