# Local development only:
# - Bind-mounts the repo over /app for live code.
# - Volume django_venv → /app/.venv keeps the image-built virtualenv; without it,
#   the bind mount would hide .venv and Python would not see Django.
# - migrate + runserver (see README for optional loaddata).
services:
  web_app:
    container_name: web_app
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    # restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - django_venv:/app/.venv
      - emails:/app/emails
  db:
    container_name: pet_shelter_db
    image: postgres:18.3
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env
    # restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  django_venv:
  emails:
