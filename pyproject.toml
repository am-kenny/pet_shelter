[project]
name = "pet-shelter"
version = "0.1.0"
description = "Pet shelter management system (Django)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.4,<6.1",
    "gunicorn>=25.3,<26",
    "psycopg[binary]>=3.3,<4",
    "pillow>=12.2,<13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "DJ",
    "S",
    ]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
